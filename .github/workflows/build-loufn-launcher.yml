name: Build LouFN Launcher APK

on:
  push:
    paths:
      - "LouFN-Launcher/**"
      - ".github/workflows/build-loufn-launcher.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle -p LouFN-Launcher :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LouFN-Launcher-debug-apk
          path: LouFN-Launcher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
