name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;23.2.8568313 cmake;3.22.1'
          accept-android-sdk-licenses: true
      - name: Download Godot and export templates
        shell: bash
        run: |
          set -e
          wget -q "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip
          mv Godot_v4.4.1-stable_linux.x86_64 godot
          chmod +x godot
          wget -q "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz" -O templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          unzip -q templates.tpz -d templates
          cp templates/templates/* "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
      - name: Verify Android SDK packages
        shell: bash
        run: |
          set -e
          sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;23.2.8568313" "cmake;3.22.1"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/ndk/23.2.8568313"
          test -d "$ANDROID_HOME/cmake/3.22.1"
          echo "Android SDK, NDK and CMake OK: $ANDROID_HOME"
      - name: Configure Android SDK and debug signing
        shell: bash
        run: |
          set -e
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
      - name: Import project
        run: ./godot --headless --editor --path . --quit
      - name: Export debug APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -o pipefail
          mkdir -p build
          cp "$HOME/.android/debug.keystore" "$RUNNER_TEMP/debug.keystore"
          ./godot --headless --verbose --path . --export-debug "Android" build/LouFN-OG-debug.apk 2>&1 | tee build/export.log
          test -s build/LouFN-OG-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LouFN-OG-debug-apk
          path: build/LouFN-OG-debug.apk
          if-no-files-found: error
